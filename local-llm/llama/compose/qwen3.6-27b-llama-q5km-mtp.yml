# ===========================================================================
# Qwen3.6-27B (unsloth/Qwen3.6-27B-MTP-GGUF, Q5_K_M) — MAINLINE llama.cpp,
# dual-GPU, MTP speculative decoding + vision, full native context.
#
# Replaces the archived ik_llama.cpp single-GPU config
# (archive/qwen3.6-27b-ik-iq4ks-mtp-solo.yml.bak). Switched off ik_llama.cpp
# because we don't need its Hadamard KV transforms (-khad/-vhad) or
# recurrent-checkpoint tuning to hit these targets on mainline, and its own
# MTP support (--spec-type draft-mtp, renamed from ik_llama's `mtp:n_max=N`
# syntax) is confirmed working for this model family.
#
# UPDATE (2026-07-21): re-enabled --mmproj. The "--mmproj + MTP not
# supported" warning in unsloth's own Qwen3.6-27B-MTP-GGUF README was
# accurate when this config was first written but is now stale — the
# underlying crash was llama.cpp issue #22867 (MTP's ubatch hook choking on
# the non-consecutive token positions image embeddings produce), fixed
# upstream in am17an/llama.cpp#5 and confirmed still fixed on current main
# (closed unmerged follow-up ggml-org/llama.cpp#23286, author couldn't
# reproduce on Qwen3.6-27B-MTP). Verified locally on this rig's image
# (server-cuda, b10066/86a9c79f8, pulled 2026-07-18): loaded --mmproj +
# --spec-type draft-mtp together with no crash/assert, and a real
# image-included chat request came back with MTP actively drafting
# (draft_n_accepted 36/37). Reuses the mmproj-F16.gguf already downloaded
# for the Q4_K_M config — it's architecture-specific, not quant-specific,
# so it's portable across any Qwen3.6-27B GGUF (same reasoning as the now-
# retired ik_llama.cpp vision sibling config).
#
# Weight quant vs KV quant tradeoff (revisited after first landing on Q6_K
# weights + q4_0 KV): weight quantization error is static and averages out
# across a forward pass — Q6_K is already near-lossless. KV cache
# quantization error instead corrupts specific cached token
# representations that attention retrieves from, and that degradation
# compounds with distance — it hits long-context recall directly, which is
# the whole point of running a 262K window. So KV precision matters more
# here than shaving the last bit off already-high weight quality. Traded
# Q6_K -> Q5_K_M weights (still very mild loss) to free enough VRAM for
# q8_0 KV (up from q4_0) at the same full context and the same margin
# targets.
#
# Architecture note: Qwen3.6-27B is a hybrid DeltaNet/full-attention model —
# only 16 of 64 layers are real full-attention (KV-cache-bearing); the other
# 48 are linear-attention (small fixed-size recurrent state, doesn't scale
# with context). This is why full 262144-token context is affordable at all
# on two 24GB cards even with q8_0 KV: 2048 KV elements/token PER full-
# attention layer (4 kv-heads x 256 key_length, plus the same for value),
# across 16 such layers rather than 64. That works out to 32768 elements or
# 34 KiB/token at q8_0 -> ~8.5GB of KV for the full 262144 window. (An
# earlier version of this note read "~2048 elements/token across the 16
# layers", which understated the total by 16x.)
#
# GPU split: explicit --tensor-split skewed heavily toward GPU1 — the goal
# is MINIMAL GPU0 usage (headless card GPU1 should carry as much as it can
# hold on its own; GPU0 is the display/gaming card and should only take the
# unavoidable overflow). The pi-subagents scout service that used to live
# on GPU0 has been retired (subagent experiment didn't pan out), freeing up
# GPU0's budget for this spillover instead.
#
# GOTCHA: -ts fraction order follows the driver's native CUDA device
# numbering (0, 1), NOT the order GPUs are listed in `device_ids:` below —
# confirmed via `nvidia-smi -L` inside the container. First tried
# device_ids ["1","0"] assuming that would make GPU1 CUDA-device-0; it
# didn't. -ts "0.82,0.18" under that wrong assumption loaded GPU0 (the
# display card) to 23.5GB/523MB-free and left GPU1 nearly idle — exactly
# backwards. Fixed by treating -ts as [GPU0 fraction, GPU1 fraction]
# unconditionally, regardless of device_ids list order.
#
# GOTCHA: -ts fraction -> layer split is quantized to discrete boundaries,
# not continuous — 0.34/0.345/0.348 all landed on the same 22-layer/GPU0
# split, and 0.352/0.36 all landed on the same 23-layer split, with a big
# jump in VRAM between them (~800MB per GPU). Fine 0.01-scale nudging
# doesn't always do anything; expect to jump between a small number of
# discrete states near your target and pick the closest one.
#
# MEASURED: ladder-tested at full 262144 ctx-size, Q5_K_M weights, q8_0/
# q8_0 KV. -ts "0.34,0.66" settled: GPU0 ~10.5-10.6GB free (target ~10GB),
# GPU1 ~480-530MB free (target ~600MB, slightly thin but stable — the next
# discrete split up put GPU0 ~440MB under target instead, a worse
# trade). KV cache is fully pre-allocated at boot (--ctx-size sizes it
# upfront, doesn't grow with use) — confirmed via a real 230,008-token
# prefill: VRAM read 486MB free on GPU1 throughout the ~6.5 minute prefill
# (585 tok/s) and after (vs 530MB at boot — the ~44MB delta is decode
# scratch space, stable, no growth risk). MTP acceptance ~61-87% depending
# on prompt (measured on real requests, not synthetic filler),
# draft_n_max=2, ~29-60 tok/s decode.
# ===========================================================================
services:
  llama-qwen36-27b-q5km-mtp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-qwen36-27b-q5km-mtp
    restart: unless-stopped
    ports:
      - "0.0.0.0:11434:8080"
    volumes:
      - /home/kinetic/data/llm-models/qwen3.6-27b-gguf/unsloth-mtp-q5km:/models:ro
      # Mounted outside /models (not nested under it) — /models is a
      # read-only bind mount, and Docker can't create a mountpoint node for
      # a second file-level bind mount inside an already-read-only parent.
      - /home/kinetic/data/llm-models/qwen3.6-27b-gguf/unsloth-mtp-q4km/mmproj-F16.gguf:/mmproj/mmproj-F16.gguf:ro
      # Writable — required by --slot-save-path below. Under normal
      # operation this stays effectively empty: seqagent erases a
      # subagent's slot right after it exits (pi/agent/extensions/seqagent/
      # index.ts) before --cache-idle-slots' idle scan ever gets a chance to
      # snapshot it, so nothing gets written here in the common case. Kept
      # host-side rather than tmpfs so a genuine parent-conversation
      # snapshot (if one is ever explicitly saved) survives a restart.
      - /home/kinetic/data/llm-slot-cache/qwen3.6-27b-q5km-mtp:/slot-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # List order here does NOT control -ts fraction order — see
              # header gotcha note. -ts below is [GPU0 fraction, GPU1
              # fraction] regardless of this list's order.
              device_ids: ["0", "1"]
              capabilities: [gpu]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model
      - /models/Qwen3.6-27B-Q5_K_M.gguf
      - --mmproj
      - /mmproj/mmproj-F16.gguf
      - --no-mmap
      - -ngl
      - "99"
      - -sm
      - layer
      # Settled — [GPU0 fraction, GPU1 fraction]. Originally ladder-tested
      # text-only at ~10.5-10.6GB free on GPU0, ~480-530MB free on GPU1 (see
      # header for that history and the device-order/layer-boundary
      # gotchas). Unchanged after adding --mmproj (2026-07-21): booted clean
      # at the same split with ~9.4GB free on GPU0, ~885MB free on GPU1 at
      # full 262144 ctx — margin held, no re-ladder needed.
      - -ts
      - "0.34,0.66"
      - --ctx-size
      - "262144"
      - -b
      - "2048"
      - -ub
      - "1024"
      # Stays at 1 deliberately. --ctx-size is a TOTAL pool that llama.cpp
      # divides by slot count (verified: -c 8192 -np 2 -> n_ctx_slot 4096),
      # so -np 2 would halve every slot to 131072 — and real agent contexts
      # here run 200-206K tokens, which would silently truncate. Two slots
      # at full context would need -c 524288 = +8.5GB KV, which doesn't fit.
      # The subagent-eviction problem is solved by --cache-ram below instead.
      - -np
      - "1"
      # Host-RAM prompt cache (ggml-org/llama.cpp#16391). Paired with
      # --cache-idle-slots (default enabled), this snapshots the idle slot's
      # KV state to host RAM when a new task takes the slot, then restores it
      # instead of reprefilling — exactly the main-agent/subagent swap case.
      #
      # SIZING: KV proper is 34 KiB/token here — 16 full-attention layers x
      # (4 kv-heads x 256 key_length + same for value) x 1.0625 B/elem for
      # q8_0. The 8192 MiB default held exactly ONE conversation: the
      # subagent's entry evicted the main agent's every single time, costing
      # a full reprefill (measured: 201,506 tokens / 341s at ~590 tok/s).
      #
      # CORRECTION (2026-08-02): the "16384 fits two full-size entries with
      # headroom" note this replaces was wrong, because 34 KiB/token only
      # counts the KV. Cache entries also carry the slot's CONTEXT
      # CHECKPOINTS, and those dominate: measured entries at ~100K tokens ran
      # 8.7-9.4GB (~95 KiB/token, 2.8x the KV-only figure) against the ~3.3GB
      # the old math predicted. So 16384 still held only one entry, and the
      # working-status summary side-channel — which back then ran against this
      # server carrying the whole conversation, making its entry a full-size
      # twin of the main one — evicted it on every cadence tick. Result: a
      # 116-126s full reprefill every other turn.
      #
      # That side-channel no longer touches this server at all: status
      # summaries moved to a dedicated 2B on :11437
      # (qwen3.5-2b-summariser.yml). Shrinking its request was tried first and
      # was NOT enough — with -np 1 the swap-out cost is paid whatever the
      # request size, because a hybrid recurrent slot can't be rolled back
      # cheaply. Only moving it off this server actually fixed it.
      #
      # Left at 16384: with the checkpoint cap below (raised 4 -> 8 on
      # 2026-08-07) an entry runs ~6.4GB at the far end of a 200K-token
      # conversation (was ~3.4GB at -ctxcp 4), so this now holds ~2
      # comfortably rather than "several" — still fine since this server
      # serves one conversation at a time. Box has 46GB RAM but only ~24GB
      # available with 5GB of swap already in use, so there's no headroom to
      # solve anything by raising it further.
      - --cache-ram
      - "16384"
      # Context checkpoints are how a slot rolls back to an earlier position.
      # For pure attention that's just dropping KV cells; for this model's 48
      # linear-attention (DeltaNet) layers the recurrent state is a running
      # fold that can't be reversed, so a checkpoint at/before the branch
      # point is the ONLY way back — hence they're kept, not disabled.
      #
      # But the default 32 is sized for cheap SWA-window checkpoints
      # (ggml-org/llama.cpp#15293, where this was --swa-checkpoints); on a
      # hybrid model each checkpoint's cost grows with position instead of
      # being fixed. Measured directly from this server's own "erasing old
      # context checkpoint" log lines (size vs pos_min across many samples):
      # size ~= 149.6 MiB + 3.9 KiB/token. At --checkpoint-min-step 8192,
      # checkpoints land every ~8192 tokens, so N of them cover a rollback
      # window of N*8192 tokens counting back from wherever the conversation
      # currently is.
      #
      # 4 (original setting) covers only the last ~32K tokens of rollback —
      # too short given real conversations here run 200-206K tokens, so
      # branching/editing further back than that forced a full reprefill
      # more often than desired (found 2026-08-07). Raised to 8: ~65K-token
      # window, at a RAM cost (for a checkpoint queue at the far end of a
      # ~200K-token conversation) of ~6.4GB vs ~3.5GB at 4 — the box has
      # ~22GB "available" per `free -h` plus zram swap (cheap, compressed
      # RAM, not disk), so the extra ~3GB has headroom. 12 and 16 were
      # considered (~8.9GB / ~10.8GB respectively, ~98K/~131K-token windows)
      # but 8 was picked as the cheaper fix; revisit upward if reprefills
      # still show up beyond a 65K-token branch depth.
      #
      # NOT related to the upstream hybrid checkpoint bugs (#24055, #20225,
      # #19794) where checkpoints are always invalidated — this server logs
      # zero "erased invalidated context checkpoint" / "forcing full prompt
      # re-processing due to lack of cache data" lines. Worth re-grepping for
      # those before blaming this flag if reprefills reappear.
      - -ctxcp
      - "8"
      # Unlocks POST /slots/{id}?action=erase (confirmed: without this flag
      # the endpoint 501s). Used by seqagent's erase-on-subagent-exit fix
      # (pi/agent/extensions/seqagent/index.ts, toggle via
      # /seqagent-llama-cache-fix) to wipe a subagent's slot before
      # --cache-idle-slots' idle scan can snapshot it into the --cache-ram
      # FIFO above — that snapshotting was evicting the main agent's own
      # cache entry and forcing a ~163K-token full reprefill (found
      # 2026-08-01). We only ever use the erase action; save/restore come
      # along for free since they're gated behind the same flag.
      - --slot-save-path
      - /slot-cache
      - -ctk
      - q8_0
      - -ctv
      - q8_0
      - -fa
      - "on"
      - --spec-type
      - draft-mtp
      - --spec-draft-n-max
      - "3"
      - --spec-draft-p-min
      - "0.0"
      - --jinja
      - --reasoning
      - "on"
      - --reasoning-format
      - deepseek
      # Was --chat-template-kwargs '{"enable_thinking":true,"preserve_thinking":true}'.
      # Both halves are now first-class flags, and the server warned about both
      # on boot:
      #   W Setting 'enable_thinking' via --chat-template-kwargs is deprecated.
      #     Use --reasoning on / --reasoning off instead.
      #   I srv init: chat template supports preserving reasoning, consider
      #     enabling it via --reasoning-preserve
      # enable_thinking was already redundant (--reasoning on is set above), and
      # --reasoning-preserve (ggml-org/llama.cpp#25105) applies through the
      # template's advertised `supports_preserve_reasoning` capability — which
      # /props confirms this template has — rather than by setting a raw Jinja
      # variable by name, so it won't silently stop working if the template
      # renames it. Behaviourally identical to what the kwargs were doing.
      #
      # Kept ON for reasoning quality, NOT as a cache fix: ggml-org/llama.cpp#22615
      # tested preserve_thinking on Qwen3.5-arch specifically and found it does
      # not unlock the prompt cache (identical-request speedup stayed 0.67x —
      # the hybrid-recurrent pos_min > pos_min_thold skip is independent of it).
      # What it does buy there is multi-turn reasoning recall, ~16.7% -> 58.3%,
      # for 43-193 extra prompt tokens per turn.
      #
      # It does also keep history append-only: without it the template falls
      # back to `loop.index0 > ns.last_query_index`, retaining thinking only
      # after the last user query, so every turn rewrites the history behind it.
      - --reasoning-preserve
      - --temp
      - "0.6"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0"
      - --presence-penalty
      - "0.0"
      - --repeat-penalty
      - "1.0"
